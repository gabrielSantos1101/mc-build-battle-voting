<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Fundo base Deepslate Escuro e Suave (Sem ruído de cores neon) -->
  <rect width="64" height="64" fill="#0c0b12" />
  
  <!-- Linhas de argamassa entre os tijolos de Deepslate (Tiled 32x16 / 64x32) -->
  <rect x="0" y="0" width="64" height="2" fill="#06050a" />
  <rect x="0" y="32" width="64" height="2" fill="#06050a" />
  
  <rect x="0" y="0" width="2" height="32" fill="#06050a" />
  <rect x="32" y="32" width="2" height="32" fill="#06050a" />
  
  <!-- Chanfro sutil de iluminação superior dos blocos de ardósia -->
  <rect x="2" y="2" width="62" height="2" fill="#151320" />
  <rect x="2" y="34" width="28" height="2" fill="#151320" />
  <rect x="34" y="34" width="30" height="2" fill="#151320" />
  
  <!-- Chanfro sutil de sombra inferior dos blocos -->
  <rect x="2" y="30" width="62" height="2" fill="#08070d" />
  <rect x="2" y="62" width="28" height="2" fill="#08070d" />
  <rect x="34" y="62" width="30" height="2" fill="#08070d" />
  
  <!-- Textura sutil pixel-art de pedra/ardósia polida -->
  <rect x="8" y="8" width="12" height="4" fill="#100f1a" />
  <rect x="24" y="16" width="16" height="4" fill="#100f1a" />
  <rect x="46" y="10" width="12" height="6" fill="#100f1a" />
  <rect x="6" y="40" width="14" height="6" fill="#100f1a" />
  <rect x="38" y="44" width="18" height="4" fill="#100f1a" />
  <rect x="22" y="52" width="8" height="4" fill="#100f1a" />
  <rect x="54" y="52" width="8" height="4" fill="#100f1a" />
</svg>
