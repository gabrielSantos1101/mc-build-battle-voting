<svg xmlns="http://www.w3.org/2000/svg" width="64" height="24" viewBox="0 0 64 24" shape-rendering="crispEdges">
  <!-- Borda horizontal chanfrada de Deepslate -->
  <rect width="64" height="24" fill="#141120" />
  
  <rect x="0" y="0" width="64" height="3" fill="#242036" />
  <rect x="0" y="21" width="64" height="3" fill="#06050a" />
  
  <!-- Divisões de blocos -->
  <rect x="0" y="0" width="3" height="24" fill="#06050a" />
  <rect x="32" y="0" width="3" height="24" fill="#06050a" />
  
  <!-- Highlights -->
  <rect x="3" y="3" width="2" height="18" fill="#242036" />
  <rect x="35" y="3" width="2" height="18" fill="#242036" />
  
  <!-- Detalhes pixelados -->
  <rect x="10" y="8" width="12" height="4" fill="#0e0c17" />
  <rect x="42" y="10" width="14" height="4" fill="#0e0c17" />
  <rect x="16" y="14" width="2" height="2" fill="#00e5ff" opacity="0.7" />
  <rect x="52" y="8" width="2" height="2" fill="#7928ca" opacity="0.7" />
