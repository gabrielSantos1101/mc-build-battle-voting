<svg xmlns="http://www.w3.org/2000/svg" width="32" height="64" viewBox="0 0 32 64" shape-rendering="crispEdges">
  <!-- Pilar de Pedra Entalhada Minecraft (Chiseled Deepslate / Blackstone Pillar) -->
  <rect width="32" height="64" fill="#0e0d16" />
  
  <!-- Borda externa profunda -->
  <rect x="0" y="0" width="3" height="64" fill="#040306" />
  <rect x="29" y="0" width="3" height="64" fill="#040306" />
  
  <!-- Linhas de relevo verticais da coluna chanfrada -->
  <rect x="3" y="0" width="3" height="64" fill="#201d2e" />
  <rect x="26" y="0" width="3" height="64" fill="#08070d" />
  
  <!-- Junta de bloco horizontal a cada 32px -->
  <rect x="0" y="0" width="32" height="2" fill="#040306" />
  <rect x="0" y="32" width="32" height="2" fill="#040306" />
  <rect x="3" y="2" width="26" height="2" fill="#201d2e" />
  <rect x="3" y="34" width="26" height="2" fill="#201d2e" />
  <rect x="3" y="30" width="26" height="2" fill="#08070d" />
  <rect x="3" y="62" width="26" height="2" fill="#08070d" />
  
  <!-- Bloco Central Entalhado (Chiseled Pattern) -->
  <!-- Seção Superior (0 a 32px) -->
  <rect x="8" y="6" width="16" height="20" fill="#13111e" />
  <rect x="8" y="6" width="16" height="2" fill="#252236" />
  <rect x="8" y="6" width="2" height="20" fill="#252236" />
  <rect x="8" y="24" width="16" height="2" fill="#06050a" />
  <rect x="22" y="6" width="2" height="20" fill="#06050a" />
  <rect x="12" y="10" width="8" height="12" fill="#090810" />
  <rect x="14" y="12" width="4" height="8" fill="#1b1828" />
  
  <!-- Seção Inferior (32 a 64px) -->
  <rect x="8" y="38" width="16" height="20" fill="#13111e" />
  <rect x="8" y="38" width="16" height="2" fill="#252236" />
  <rect x="8" y="38" width="2" height="20" fill="#252236" />
  <rect x="8" y="56" width="16" height="2" fill="#06050a" />
  <rect x="22" y="38" width="2" height="20" fill="#06050a" />
  <rect x="12" y="42" width="8" height="12" fill="#090810" />
  <rect x="14" y="44" width="4" height="8" fill="#1b1828" />
</svg>
