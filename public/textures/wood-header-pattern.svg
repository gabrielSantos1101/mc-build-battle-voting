<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Fundo Dark Oak Plank -->
  <rect width="64" height="64" fill="#3c220f" />
  
  <!-- Linhas horizontais de tábuas -->
  <rect x="0" y="0" width="64" height="2" fill="#201107" />
  <rect x="0" y="16" width="64" height="2" fill="#201107" />
  <rect x="0" y="32" width="64" height="2" fill="#201107" />
  <rect x="0" y="48" width="64" height="2" fill="#201107" />
  
  <!-- Linhas de brilho superior das tábuas -->
  <rect x="0" y="2" width="64" height="2" fill="#523219" />
  <rect x="0" y="18" width="64" height="2" fill="#523219" />
  <rect x="0" y="34" width="64" height="2" fill="#523219" />
  <rect x="0" y="50" width="64" height="2" fill="#523219" />
  
  <!-- Detalhes de nós e veios de madeira -->
  <rect x="12" y="6" width="8" height="2" fill="#301a0a" />
  <rect x="36" y="8" width="14" height="2" fill="#301a0a" />
  <rect x="4" y="22" width="18" height="2" fill="#301a0a" />
  <rect x="40" y="24" width="8" height="2" fill="#301a0a" />
  <rect x="18" y="38" width="12" height="2" fill="#301a0a" />
  <rect x="48" y="40" width="10" height="2" fill="#301a0a" />
  <rect x="8" y="54" width="16" height="2" fill="#301a0a" />
  
  <!-- Pregos / Detalhes de fixação -->
  <rect x="2" y="6" width="2" height="2" fill="#180b03" />
  <rect x="60" y="22" width="2" height="2" fill="#180b03" />
  <rect x="30" y="38" width="2" height="2" fill="#180b03" />
</svg>
