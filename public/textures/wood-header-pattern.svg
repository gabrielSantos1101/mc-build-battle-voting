<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Viga de Madeira Dark Oak Autêntica do Minecraft (Conforme Mockup) -->
  <rect width="64" height="64" fill="#46220c" />
  
  <!-- Linha superior chanfrada de iluminação dourada -->
  <rect x="0" y="0" width="64" height="2" fill="#7a3f1a" />
  <rect x="0" y="2" width="64" height="2" fill="#5e2f12" />
  
  <!-- Linha inferior de sombra profunda -->
  <rect x="0" y="60" width="64" height="2" fill="#241005" />
  <rect x="0" y="62" width="64" height="2" fill="#120702" />
  
  <!-- Textura interna de veios de madeira natural -->
  <rect x="0" y="16" width="64" height="1" fill="#381907" opacity="0.6" />
  <rect x="0" y="32" width="64" height="1" fill="#381907" opacity="0.6" />
  <rect x="0" y="48" width="64" height="1" fill="#381907" opacity="0.6" />
  
  <rect x="8" y="8" width="16" height="3" fill="#3b1c0a" />
  <rect x="36" y="12" width="20" height="3" fill="#3b1c0a" />
  <rect x="4" y="26" width="24" height="3" fill="#3b1c0a" />
  <rect x="44" y="28" width="12" height="3" fill="#3b1c0a" />
  <rect x="18" y="42" width="18" height="3" fill="#3b1c0a" />
  <rect x="48" y="44" width="10" height="3" fill="#3b1c0a" />
  <rect x="10" y="54" width="22" height="2" fill="#3b1c0a" />
</svg>
